<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1A1A">
<title>Magazzino</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Magazzino">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#1A1A1A;--mut:#6B6B6B;--line:#E4E4E4;--bg:#F6F5F2;--card:#FFFFFF;--yel:#FFE9A8;--grn:#D7EFD2;--red:#FBD3D3;--acc:#1A1A1A}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,Arial,sans-serif;font-size:16px}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 120px}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:14px 16px calc(14px);display:flex;align-items:center;gap:12px}
.top .t{flex:1;min-width:0}
.top small{display:block;font-size:11px;letter-spacing:3px;font-weight:700;opacity:.75}
.top h1{margin:0;font-size:24px;font-weight:900;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:20px;display:grid;place-items:center}
.pill-btn{height:40px;padding:0 14px;border-radius:20px;border:0;background:#fff;color:var(--ink);font-weight:800;font-size:14px;white-space:nowrap}
.pill-btn.on{background:var(--yel)}
.search{margin:16px 0 8px;position:relative}
.search input{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 16px 0 44px;font-size:17px;outline:none}
.search input:focus{border-color:var(--ink)}
.search span{position:absolute;left:16px;top:15px;font-size:18px;color:var(--mut)}
h2{font-size:13px;letter-spacing:2px;font-weight:800;margin:22px 0 10px;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{background:var(--card);border:0;border-radius:18px;padding:18px 16px;text-align:left;box-shadow:0 1px 0 var(--line);min-height:116px;display:flex;flex-direction:column;justify-content:space-between}
.pcard b{font-size:24px;font-weight:900}
.pcard .meta{font-size:13px;color:var(--mut);line-height:1.5}
.pcard .meta strong{color:var(--ink)}
.wide{width:100%;height:56px;border-radius:16px;border:0;background:var(--ink);color:#fff;font-weight:800;font-size:16px;margin-top:16px}
.wide.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.wide.danger{background:#B3261E}
.chip{flex:none;min-width:38px;height:28px;padding:0 8px;border-radius:8px;display:inline-grid;place-items:center;font-weight:900;font-size:13px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 0 var(--line)}
.item{display:flex;align-items:center;gap:12px}
.item .info{flex:1;min-width:0}
.item b{display:block;font-size:16px;font-weight:700;line-height:1.25}
.item small{display:block;font-size:13px;color:var(--mut);margin-top:2px;line-height:1.35}
.dispo{flex:none;text-align:right;font-weight:900;font-size:22px;line-height:1}
.dispo small{display:block;font-size:11px;font-weight:600;color:var(--mut);margin-top:3px}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700}
.ty{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:2px}
.ty.k{background:#EDE3F7;color:#5B2A86}.ty.c{background:#E3F0FA;color:#0E4C7A}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#4A90D9;margin-right:7px;vertical-align:1px;flex:none}
.kitc{font-size:12px;color:var(--mut);white-space:pre-line;margin-top:3px}
.fin{flex:none;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12px;font-weight:700;padding:6px 10px}
.fin.on{background:#FFD699;border-color:#E39B2D;color:#7A3E00}
.buy{background:#FFF4E0;border:1px solid #F2C27A;border-radius:12px;padding:10px 14px;margin:12px 0}
.buy b{display:block;font-size:13px;margin-bottom:4px}.buy span{font-size:13px}
.inote{font-size:12px;color:#7A5B00;margin-top:3px;display:flex;gap:6px;align-items:flex-start}.inote em{font-style:normal;color:var(--mut);flex:none}
.inote button{flex:none;border:1px solid #E3C66B;background:#FFF6D6;border-radius:6px;font-size:11px;font-weight:800;padding:1px 6px;margin-left:auto}
.nbtn{flex:none;width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:14px;margin-right:6px}
.nbtn.on{background:#FFF0C2;border-color:#E3C66B}
.tagnt{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:#FFF0C2;color:#7A5B00;white-space:nowrap;margin-left:auto}
.tagnt+.tagfin,.tagnt+.cnt,.tagfin+.cnt{margin-left:8px}
details.sec-card>summary .snm{flex:1;min-width:0;line-height:1.2}
.scol{flex:none;width:44px;display:flex;justify-content:center}
.scnt{flex:none;width:26px;text-align:right;font-size:14px;color:var(--mut);font-weight:700}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:3px;width:44px;height:24px;border-radius:7px;font-size:12px;font-weight:800;box-sizing:border-box}
.pill.nt{background:#FFF0C2;color:#7A5B00}
.sbox{flex:none;width:84px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:3px;font-size:12px;box-sizing:border-box;border:1px solid var(--line);background:#fff;line-height:1}
.sbox b{font-size:15px;font-weight:900}.sbox span{color:var(--mut);font-weight:600}
.sbox.low{background:#FFF0C2;border-color:#E3C66B}.sbox.zero{background:#FBD3D3;border-color:#E39A9A;color:#8A1111}.sbox.zero span{color:#8A1111}
button.sbox{border:1.5px dashed #BDBDBD;color:var(--mut);font-weight:800;font-size:9.5px!important;letter-spacing:.2px;font-family:inherit;padding:0;gap:2px;white-space:nowrap}
button.sbox.on{border:1.5px solid #E39B2D;background:#FFD699;color:#7A3E00}
.rcons{flex:none;width:138px;display:flex;justify-content:center}
.erow .nbtn{margin-right:0}.pill.fn{background:#FFD699;color:#7A3E00}
.notesbox{background:#FFF8DD;border:1px solid #EBD38A;border-radius:12px;padding:10px 14px;margin:12px 0}.notesbox>b{display:block;font-size:13px;margin-bottom:6px}
.notesbox .nr{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid #F0E2B0;font-size:13px}.notesbox .nr:first-of-type{border-top:0}.notesbox .nr div{flex:1;min-width:0}.notesbox .nr small{display:block;color:var(--mut);font-size:11px}
.b-low{background:var(--yel)} .b-zero{background:var(--red);color:#8A1111}
.sec-h{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.sec-h .chip{height:30px}
.sec-h span.n{font-weight:800;font-size:15px}
.sec-h .cnt{margin-left:auto;font-size:13px;color:var(--mut)}
.summary{display:flex;gap:8px;margin:16px 0 4px}
.summary div{flex:1;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 1px 0 var(--line)}
.summary b{display:block;font-size:22px;font-weight:900}
.summary small{font-size:12px;color:var(--mut)}
.qty{flex:none;font-size:26px;font-weight:900;min-width:52px;text-align:right}
.acts{display:flex;gap:8px;margin-top:12px}
.tog{flex:1;height:48px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:15px}
.tog.on{border-color:transparent}
.tog.p.on{background:var(--grn)}
.tog.r.on{background:#D3E3FD}
.tog.nt{flex:0 0 56px}
.card.done{opacity:.55}
.note{margin-top:8px;font-size:14px;background:#FFF8E1;border-radius:8px;padding:8px 10px}
.dove{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.5px;padding:2px 6px;border-radius:5px;margin-right:6px}
.erow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}
.erow .info{flex:1;min-width:0}
.erow b{font-weight:700;font-size:15px;display:block}
.erow small{font-size:12px;color:var(--mut)}
.erow.has b{font-weight:900}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;flex:none}
.stepper button{width:42px;height:42px;border:0;background:#fff;font-size:22px;font-weight:700}
.stepper input{width:54px;height:42px;border:0;text-align:center;font-weight:900;font-size:17px;outline:none;background:#fff}
.erow.has .stepper{border-color:var(--ink)}
.erow.has .stepper input{background:var(--yel)}
select.dsel{height:34px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-size:13px;margin-top:6px;max-width:100%}
.sec-card{background:#fff;border-radius:16px;padding:4px 14px;margin-bottom:10px;box-shadow:0 1px 0 var(--line)}
details.sec-card>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 0;font-weight:800}
details.sec-card>summary::-webkit-details-marker{display:none}
details.sec-card>summary .cnt{margin-left:auto;font-size:13px;color:var(--mut);font-weight:600}
.add{width:100%;height:44px;border:1.5px dashed #BDBDBD;border-radius:12px;background:transparent;font-weight:700;margin:8px 0 10px;color:var(--mut)}
.del{width:36px;height:36px;border:0;background:transparent;font-size:18px;color:#B3261E}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.empty b{display:block;font-size:18px;color:var(--ink);margin-bottom:6px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}
.modal h3{margin:0 0 6px;font-size:20px;font-weight:900}
.modal p{margin:0 0 14px;color:var(--mut);font-size:15px;line-height:1.45}
.modal input,.modal textarea,.modal select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:18px;outline:none;margin-bottom:12px;background:#fff}
.modal input:focus,.modal textarea:focus{border-color:var(--ink)}
.modal .row2{display:flex;gap:10px}
.modal .row2 button{flex:1;height:52px;border-radius:14px;border:0;font-weight:800;font-size:16px}
.modal .row2.sm button{height:40px;font-size:13px;border-radius:10px}
.modal .lbl{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--mut);margin:2px 0 6px}
.sug{margin:-4px 0 12px}.sug button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:1px solid #F2C27A;background:#FFF4E0;border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:14px;font-family:inherit}
.sug button small{color:var(--mut);margin-left:auto;font-size:12px}
#ak2 button{height:40px;font-size:13px}
.btn-k{background:var(--ink);color:#fff}.btn-g{background:#EEE}.btn-d{background:#B3261E;color:#fff}
.modal ul{margin:0 0 14px;padding-left:18px;font-size:15px;line-height:1.5;max-height:40vh;overflow:auto}
.pinpad{letter-spacing:10px;text-align:center;font-size:26px!important;font-weight:900}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.seg button{flex:1;min-width:70px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:800}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:30;max-width:90%;text-align:center;font-size:15px}
.toast.err{background:#B3261E}
.loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:40;font-weight:800}
.sync{position:fixed;top:12px;right:12px;width:10px;height:10px;border-radius:50%;background:#FFD600;z-index:9;display:none}
.sync.on{display:block;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
.hint{font-size:13px;color:var(--mut);margin:6px 0 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:24px 16px calc(16px + env(safe-area-inset-bottom));z-index:4}
.bar .in{max-width:608px;margin:0 auto}

.hero{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:18px;background:var(--ink);color:#fff;padding:20px 18px;text-align:left;margin-top:12px}
.hero .t{flex:1}
.hero small{display:block;font-size:11px;letter-spacing:2.5px;font-weight:700;opacity:.7}
.hero b{display:block;font-size:24px;font-weight:900;margin-top:2px}
.hero span.m{display:block;font-size:13px;opacity:.8;margin-top:4px}
.hero .ar{font-size:26px}
.plist{background:#fff;border-radius:16px;box-shadow:0 1px 0 var(--line);overflow:hidden}
.prow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:#fff;padding:14px 16px;border-bottom:1px solid var(--line);text-align:left}
.prow:last-child{border-bottom:0}
.prow b{flex:1;font-size:18px;font-weight:800}
.prow .tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:#F0F0F0;color:var(--mut)}
.prow .tag.y{background:var(--yel);color:var(--ink)}
.prow .tag.g{background:var(--grn);color:var(--ink)}
.prow .ar{color:var(--mut);font-size:18px}
.sumline{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
.sumline span{font-size:13px;font-weight:700;padding:5px 10px;border-radius:8px;background:#fff;box-shadow:0 1px 0 var(--line)}
.lsec{background:#fff;border-radius:14px;box-shadow:0 1px 0 var(--line);overflow:hidden;margin-bottom:10px}
.lsec-h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:800;font-size:14px}
.lsec-h .chip{height:24px;min-width:32px;font-size:12px}
.lrow{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow.done{opacity:.45}
.lrow .info{flex:1;min-width:0}
.lrow .nm{font-size:15px;font-weight:700;line-height:1.2}
.lrow .nm em{font-style:normal;font-weight:900;margin-left:4px}
.lrow .sub{font-size:12px;color:var(--mut);margin-top:2px;line-height:1.3}
.lrow .sub .dove{font-size:10px;padding:1px 5px;margin-right:4px}
.lrow .nt{font-size:12px;color:#7A5B00;margin-top:2px}
.mini{flex:none;height:38px;padding:0 9px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:13px}
.mini.p.on{background:var(--grn);border-color:transparent}
.mini.r.on{background:#D3E3FD;border-color:transparent}
.mini.n{width:36px;padding:0;font-size:15px}

.link{display:block;margin:18px auto 0;border:0;background:transparent;color:var(--mut);font-weight:700;font-size:14px;padding:10px}
.arow{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow .info{flex:1;min-width:0}
.arow b{display:block;font-size:17px;font-weight:800}
.arow small{font-size:12px;color:var(--mut)}

.lq{flex:none;min-width:46px;text-align:right;font-size:20px;font-weight:900;padding-right:4px;white-space:nowrap;letter-spacing:-.5px}
.mini.p.w2{width:166px;padding:0}
.tagfin{font-size:11px;font-weight:800;padding:2px 7px;white-space:nowrap;border-radius:6px;background:#FFD699;color:#7A3E00;margin-left:auto}
.tagfin+.cnt{margin-left:8px}
.mini.p,.mini.r{width:80px;padding:0}
.lrow .info{cursor:pointer}
@media (max-width:420px){.wrap{padding-left:12px;padding-right:12px}.lrow{padding:8px}.lq{width:40px;font-size:19px}.mini.p,.mini.r{width:74px;font-size:13px}.mini.p.w2{width:154px}.lq{min-width:40px;font-size:18px}}
.stepper button:disabled{color:#C8C8C8}
.top .ib + .pill-btn{margin-left:0}
a.wa{display:flex;align-items:center;justify-content:center;text-decoration:none;flex:1;height:52px;border-radius:14px;font-weight:800;font-size:16px}

.top .logo{display:block;height:20px;width:auto;margin-bottom:6px}
.prow .tag.nt{background:#FFD8B0;color:#7A3A00}
.plist.home{background:none;box-shadow:none;overflow:visible;display:flex;flex-direction:column;gap:8px}
.plist.home .prow{border-radius:14px;border-bottom:0;box-shadow:0 1px 0 var(--line);gap:8px;padding:12px 12px}
.plist.home .prow b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lchip{flex:none;width:12px;height:12px;border-radius:4px;background:#1A1A1A;margin:0 4px 0 2px}
.hc{flex:none;display:flex;justify-content:center}.hc.n{width:44px}.hc.d{width:98px}.hc.f{width:58px}
.plist.home .tag{width:100%;text-align:center;box-sizing:border-box;padding:4px 0;white-space:nowrap}
.sumline .sn{background:#FFD8B0;color:#7A3A00}
.lrow.hasnote{background:#FFF6E5}
.lrow .nt{font-size:13px;font-weight:700;color:#7A3A00;margin-top:3px}
.mini.n.on{background:#FFD8B0;border-color:transparent}
.enote{font-size:12px;font-weight:700;color:#7A3A00;background:#FFF6E5;border-radius:6px;padding:4px 8px;margin-top:4px}
@media (max-width:420px){.mini.p,.mini.r{width:68px;font-size:12.5px}.mini.n{width:34px}.lq{width:36px}}

/* --- versione compatta --- */
html,body{font-size:14px}
.top{padding:8px 12px}.top h1{font-size:19px}.top small{font-size:10px}.top .logo{height:17px;margin-bottom:4px}
.ib{width:38px;height:38px;font-size:17px;border-radius:10px}.pill-btn{height:34px;font-size:13px;padding:0 12px}
.wrap{padding:0 10px 80px!important}
.search{margin:10px 0 6px}.search input{height:44px;font-size:15px;border-radius:12px}.search span{top:12px}
h2{margin:16px 0 8px;font-size:11.5px}
.hero{padding:14px 16px;margin-top:10px}.hero b{font-size:20px}
.prow{padding:11px 14px}.prow b{font-size:16px}
.sumline{margin:8px 0 6px}.sumline span{font-size:11.5px;padding:3px 8px}
.lsec{margin-bottom:6px;border-radius:12px}
.lsec-h{padding:5px 10px;font-size:13.5px;font-weight:900;letter-spacing:.2px}.lsec-h .chip{height:20px;min-width:28px;font-size:11px}
.lrow{padding:5px 8px!important;gap:5px}.lrow .nm{font-size:13.5px;line-height:1.15;font-weight:400}.lrow .nt{font-size:11.5px}
.lq{font-size:16px!important;width:34px!important}
.mini{height:30px;font-size:12px!important;border-radius:8px;border-width:1px}.mini.p,.mini.r{width:62px!important}.mini.n{width:30px!important;font-size:13px}.mini.p.w2{width:130px!important}.lq{width:auto!important;min-width:36px}
.sec-card{padding:2px 12px;border-radius:12px;margin-bottom:6px}details.sec-card>summary{padding:8px 0;font-size:13.5px;font-weight:900}
.erow{padding:6px 0;gap:8px}.erow b{font-size:13.5px;font-weight:400}.erow small{font-size:11.5px}
.stepper button{width:34px;height:34px;font-size:18px}.stepper input{width:38px;height:34px;font-size:15px}
.dispo{font-size:16px}.badge{font-size:11.5px}
.arow{padding:9px 12px}.arow b{font-size:15px}

function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);

  return new Promise(function (res, rej) {
    var r = google.script.run
      .withSuccessHandler(function (d) { busy--; syncDot(); res(d); })
      .withFailureHandler(function (e) { busy--; syncDot(); rej(e); });
    r.api(fn, args);

}
function syncDot() { document.getElementById('sync').className = 'sync' + (busy > 0 ? ' on' : ''); }
function save(fn) {
  var args = Array.prototype.slice.call(arguments);
  return call.apply(null, args).then(function (d) { S.data = d; render(); return d; })
    .catch(function (e) { toast(msg(e), true); call('getData').then(function (d) { S.data = d; render(); }); throw e; });
}
function readParams(cb) {
  var q = new URLSearchParams(location.search), h = location.hash || '', o = {};
  if (q.get('l')) o.lista = FBX.listName(q.get('l')) || null;
  else if (q.get('lista')) o.lista = q.get('lista');
  else { var m = h.match(/^#lista-(.+)$/); if (m) o.lista = decodeURIComponent(m[1]); }
  if (q.get('vista') === 'inventario' || h === '#inventario') o.vista = 'inventario';
  cb(o);
}

function adminCall(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return call.apply(null, [fn, S.admin].concat(args)).then(function (list) { S.alist = list; return call('getData'); })
    .then(function (d) { S.data = d; render(); return true; }).catch(function (e) { toast(msg(e), true); return false; });
}
function form(title, sub, fields, okLabel, danger) {
  return new Promise(function (res) {
    var m = modal('<h3>' + esc(title) + '</h3>' + (sub ? '<p>' + esc(sub) + '</p>' : '') +
      fields.map(function (f, i) { return '<input id="f' + i + '" placeholder="' + esc(f.ph) + '" value="' + esc(f.v || '') + '"' + (f.num ? ' inputmode="numeric"' : '') + ' autocomplete="off">'; }).join('') +
      '<div class="row2"><button class="btn-g" id="fc">Annulla</button><button class="' + (danger ? 'btn-d' : 'btn-k') + '" id="fk">' + esc(okLabel) + '</button></div>');
    m.querySelector('#fc').onclick = function () { closeModal(); res(null); };
    m.querySelector('#fk').onclick = function () { var v = fields.map(function (f, i) { return m.querySelector('#f' + i).value.trim(); }); closeModal(); res(v); };
  });
}

/* ---------- eventi ---------- */
var timers = {};
function bind() {
  var q = document.getElementById('q');
  if (q) q.oninput = function () { S.q = q.value; document.getElementById('res').innerHTML = results(S.q); };
  var mq = document.getElementById('mq');
  if (mq) mq.oninput = function () {
    S.mq = mq.value; var pos = mq.selectionStart; render();
    var n = document.getElementById('mq'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {}
  };
  document.querySelectorAll('details[data-k]').forEach(function (d) {
    d.addEventListener('toggle', function () { S.openSec[d.getAttribute('data-k')] = d.open; });
  });
  document.querySelectorAll('[data-a]').forEach(function (el) {
    var a = el.getAttribute('data-a');
    if (a === 'qty' || a === 'totin') el.onchange = function () { act(a, el); };
    else if (a === 'dove') el.onchange = function () { act(a, el); };
    else el.onclick = function (ev) { ev.preventDefault(); act(a, el); };
  });
}

function act(a, el) {
  var p = S.producer, c = el.getAttribute('data-c'), s = c === '*' ? el.getAttribute('data-s') : Number(el.getAttribute('data-s'));
  if (a === 'refresh') { load().then(function () { toast('Aggiornato'); }); }
  else if (a === 'share') { shareList(p); }
  else if (a === 'admin') {
    askPin('').then(function (pw) {
      if (!pw) return;
      if (!isAdmin()) { toast('Il tuo account non è admin', true); return; }
      call('adminList', pw).then(function (list) { S.admin = pw; S.alist = list; S.view = 'admin'; window.scrollTo(0, 0); render(); })
        .catch(function (e) { toast(msg(e), true); });
    });
  }
  else if (a === 'aadd' && !FBX.user()) { signIn().then(function (ok) { if (ok) act(a, el); }); }
  else if (a === 'aadd' && !FBX.isProd()) { toast('Solo i producer possono creare liste', true); }
  else if (a === 'login') { signIn(); }
  else if (a === 'logout') { FBX.logout().then(function () { S.edit = false; S.inv = null; return call('getData'); }).then(function (d) { S.data = d; go('home'); toast('Disconnesso'); }); }
  else if (a === 'xinv') { exportInv(); }
  else if (a === 'xlis') { exportListe(); }
  else if (a === 'imp') { importDati(); }
  else if (a === 'spdf') { pdfStorico(S.sto); }
  else if (a === 'radd') {
    var rk = el.getAttribute('data-k');
    form(rk === 'admin' ? 'Nuovo admin' : 'Nuovo producer', 'Scrivi la sua email (Gmail o qualsiasi altra): entrerà con Google o con il link via email.', [{ ph: 'nome@esempio.com' }], 'Aggiungi')
      .then(function (v) { if (v && v[0]) save('setRuolo', rk, v[0], true).then(function () { toast('Aggiunto'); }); });
  }
  else if (a === 'rdel') {
    var dk = el.getAttribute('data-k'), dn = el.getAttribute('data-n');
    form('Togliere ' + dn + '?', dk === 'admin' ? 'Non sarà più admin.' : 'Non vedrà più le liste (tranne quelle dove è collaboratore).', [], 'Togli', true)
      .then(function (v) { if (v) save('setRuolo', dk, dn, false).then(function () { toast('Tolto'); }); });
  }
  else if (a === 'collab') { collabModal(p); }
  else if (a === 'aadd') {
    var baseId = el.getAttribute('data-id') || '';
    var ma = modal('<h3>Nuova lista</h3><p>' + (baseId ? 'Parte con gli articoli di <b>' + esc(S.sto.name) + '</b> (quantità da ricontrollare). ' : 'Una lista per ogni produzione. ') + 'Potrai modificarla solo tu (e l\'admin).</p><input id="an" placeholder="Nome (es. Filo - Croquis SS27)" autocomplete="off">' +
      (!baseId && (S.data.storicoList || []).length ? '<div class="lbl">PARTI DA UN LAVORO SIMILE (FACOLTATIVO)</div><select id="abase"><option value="">— Lista vuota —</option>' + S.data.storicoList.map(function (o) { return '<option value="' + esc(o.id) + '">' + esc(o.name) + (o.closed ? ' · ' + o.closed.split('-').reverse().slice(0, 2).join('/') : '') + ' (' + o.n + ' art.)</option>'; }).join('') + '</select>' : '') +
      perFields() +
      '<div class="row2"><button class="btn-g" id="ac">Annulla</button><button class="btn-k" id="ak">Crea</button></div>');

    ma.querySelector('#ac').onclick = closeModal;
    ma.querySelector('#ak').onclick = function () {
      var nm = ma.querySelector('#an').value.trim(); if (!nm) { toast('Scrivi il nome', true); return; }
      var pw = '';
      var v = rd(); if (!v) return; closeModal();
      var bs = ma.querySelector('#abase'); if (bs && bs.value) baseId = bs.value;
      call('createList', nm, pw, v.from, v.fromP, v.to, v.toP, baseId).then(function (d) {
        S.data = d; toast('Lista creata');

        else { S.edit = true; S.mq = ''; go('list', nm); }
      }).catch(function (e) { toast(msg(e), true); });
    };
  }
  else if (a === 'arename') {
    var n1 = el.getAttribute('data-n');
    form('Rinomina ' + n1, '', [{ ph: 'Nuovo nome', v: n1 }], 'Salva')
      .then(function (v) { if (v && v[0] !== n1) adminCall('adminRename', n1, v[0]).then(function (ok) { if (ok) toast('Rinominato'); }); });
  }
  else if (a === 'apin') {
    var n2 = el.getAttribute('data-n');
    form('Nuova password per ' + n2, 'Comunicala al producer della lista.', [{ ph: 'Password (min. 4 caratteri)' }], 'Salva')
      .then(function (v) { if (v) { try { sessionStorage.removeItem('pw_' + n2); } catch (e) {} delete S.pins[n2]; adminCall('adminSetPin', n2, v[0]).then(function (ok) { if (ok) toast('Password aggiornata'); }); } });
  }
  else if (a === 'adel') {
    var n3 = el.getAttribute('data-n');
    form('Eliminare ' + n3 + '?', 'La lista viene cancellata senza PDF. Per archiviarla usa Chiudi produzione.', [], 'Elimina', true)
      .then(function (v) { if (v) adminCall('adminDelete', n3).then(function (ok) { if (ok) toast('Eliminato'); }); });
  }
  else if (a === 'home') go('home');
  else if (a === 'mag') { S.mq = ''; go('mag'); }
  else if (a === 'open') {
    var op = el.getAttribute('data-p'); S.mq = '';

  else if (a === 'edit') {
    if (S.edit) { S.edit = false; render(); return; }

  }
  else if (a === 'flag') {
    var f = el.getAttribute('data-f'); var e = item(c, s).lists[p];
    var v = !e[f]; e[f] = v; render();
    save('setFlag', p, c, s, f, v).then(function () { toast(f === 'preso' ? (v ? 'Segnato come preso' : 'Tolto') : (v ? 'Segnato come rientrato' : 'Tolto')); });

  else if (a === 'note') {
    var e2 = item(c, s).lists[p] || {};
    var m = modal('<h3>Nota</h3><p>' + esc(item(c, s).name) + '</p><textarea id="nt" rows="3" placeholder="Es. ne mancano 2, uno è rotto…">' + esc(e2.note || '') + '</textarea>' +
      '<div class="row2"><button class="btn-g" id="nc">Annulla</button><button class="btn-k" id="nk">Salva</button></div>');
    m.querySelector('#nc').onclick = closeModal;
    m.querySelector('#nk').onclick = function () { var t = m.querySelector('#nt').value; closeModal(); save('setNote', p, c, s, t).then(function () { toast('Nota salvata'); }); };
  }
  else if (a === 'step' || a === 'qty') {
    var key = c + '|' + s; var it = item(c, s); var e3 = it.lists[p] || {};
    var cur = pending[key] !== undefined ? pending[key] : (hasQty(e3) ? Number(e3.qty) || 0 : 0);
    var nv = a === 'step' ? Math.max(0, cur + Number(el.getAttribute('data-d'))) : Math.max(0, parseInt(el.value, 10) || 0);

    if (nv > mx) { nv = mx; toast(mx ? 'Disponibili solo ' + mx : 'Nessuno disponibile', true); }
    pending[key] = nv === 0 ? '' : nv;
    var row = el.closest('.erow'); row.querySelector('input').value = pending[key]; row.className = 'erow' + (nv ? ' has' : '');
    var bs = row.querySelectorAll('.stepper button'); bs[0].disabled = nv <= 0; bs[1].disabled = nv >= mx;
    var sm = row.querySelector('small'); if (sm) sm.innerHTML = availTxt(it, mx, nv, p);
    clearTimeout(timers[key]);
    timers[key] = setTimeout(function () {
      var val = pending[key];
      save('setQty', p, pinOf(p), c, s, val).then(function () { delete pending[key]; render(); }, function () { delete pending[key]; });
    }, 700);
  }
  else if (a === 'dove') { save('setDove', p, pinOf(p), c, s, el.value); }
  else if (a === 'newp') {
    var mp = modal('<h3>Prodotto da procurare</h3><p>Solo per questa produzione: va comprato o noleggiato e non entra in inventario.</p>' +

      '<div class="row2"><button class="btn-g" id="npc">Annulla</button><button class="btn-k" id="npk">Aggiungi</button></div>');
    var all = []; S.data.sections.forEach(function (x) { x.items.forEach(function (it) { all.push({ s: x, it: it }); }); });
    mp.querySelector('#np').oninput = function () {
      var v = this.value.trim().toLowerCase(), box = mp.querySelector('#sug');

      box.innerHTML = hits.map(function (x, i) { return '<button data-i="' + i + '"><span>C\'è già in inventario: <b>' + esc(x.it.name) + '</b></span><small>' + esc(x.s.code) + '</small></button>'; }).join('');
      box.querySelectorAll('button').forEach(function (b) {
        b.onclick = function () { var x = hits[Number(b.getAttribute('data-i'))]; closeModal(); S.mq = x.it.name; S.openSec['e' + x.s.code] = true; render(); toast('Trovato: imposta la quantità'); };

    };
    mp.querySelector('#npc').onclick = closeModal;
    mp.querySelector('#npk').onclick = function () {
      var nm = mp.querySelector('#np').value.trim();
      if (!nm) { toast('Scrivi il nome del prodotto', true); return; }

      closeModal();
      save('addToList', p, pinOf(p), nm, qq, nt).then(function () { toast('Aggiunto: da procurare'); });

  else if (a === 'tclosed') { S.showClosed = !S.showClosed; render(); }
  else if (a === 'reopen') { askPin(p).then(function (pw) { if (pw) save('riapriProduzione', p, pw).then(function (ok) { if (ok !== false) toast('Produzione riaperta'); }); }); }
  else if (a === 'period') {
    var mp = modal('<h3>Date della produzione</h3><p>Servono per calcolare cosa è disponibile in quei giorni.</p>' + perFields(perOf(p)) +

    var rp = perRead(mp);
    mp.querySelector('#pc').onclick = closeModal;
    mp.querySelector('#pk').onclick = function () { var v = rp(); if (!v) return; closeModal(); save('setPeriod', p, pinOf(p), v.from, v.fromP, v.to, v.toP).then(function (ok) { if (ok !== false) toast('Date salvate'); }); };
  }
  else if (a === 'xedit') {
    var xe = ((S.data.extras || {})[p] || []).filter(function (x) { return x.name === s; })[0];
    if (!xe) return;
    var mx2 = modal('<h3>Modifica prodotto da procurare</h3>' +
      '<input id="xn" placeholder="Nome del prodotto" autocomplete="off" value="' + esc(xe.name) + '">' +
      '<input id="xq" inputmode="numeric" placeholder="Quanti ne servono?" value="' + esc(hasQty(xe) ? xe.qty : '') + '">' +
      '<textarea id="xt" rows="2" placeholder="Note (facoltative)">' + esc(xe.note || '') + '</textarea>' +
      '<div class="row2"><button class="btn-g" id="xc">Annulla</button><button class="btn-k" id="xk">Salva</button></div>' +
      '<button class="btn-d xdel" id="xd">Elimina dalla lista</button>');
    mx2.querySelector('#xc').onclick = closeModal;
    mx2.querySelector('#xk').onclick = function () {
      var nm = mx2.querySelector('#xn').value.trim();
      if (!nm) { toast('Scrivi il nome del prodotto', true); return; }
      var qq = mx2.querySelector('#xq').value, nt = mx2.querySelector('#xt').value;
      closeModal();
      save('editExtra', p, pinOf(p), xe.name, nm, qq, nt).then(function (ok) { if (ok !== false) toast('Salvato'); });
    };
    mx2.querySelector('#xd').onclick = function () {
      closeModal();
      save('removeExtra', p, pinOf(p), xe.name).then(function (ok) { if (ok !== false) toast('Eliminato'); });

  }
  else if (a === 'inote') {
    var itn = item(c, s);
    var mn = modal('<h3>Nota su ' + esc(itn.name) + '</h3><p>La leggono i producer. Es. ne mancano 2, da aggiungerne 3, uno è rotto…</p><textarea id="ntx" rows="3"></textarea>' +
      '<div class="row2"><button class="btn-g" id="nxc">Annulla</button><button class="btn-k" id="nxk">Invia</button></div>');
    mn.querySelector('#nxc').onclick = closeModal;
    mn.querySelector('#nxk').onclick = function () {
      var t = mn.querySelector('#ntx').value.trim(); if (!t) { toast('Scrivi la nota', true); return; }
      closeModal(); save('addInvNote', c, s, t).then(function () { toast('Nota inviata'); });
    };
  }
  else if (a === 'inclose') {
    var r = Number(el.getAttribute('data-r'));
    save('closeInvNote', pinOf(S.inv), r).then(function () { toast('Nota segnata come fatta'); });
  }
  else if (a === 'fin') {
    var itf = item(c, s); var nvf = !itf.finendo; itf.finendo = nvf; render();
    save('setFinendo', c, s, nvf).then(function () { toast(nvf ? 'Aggiunto a Da ricomprare' : 'Tolto da Da ricomprare'); });
  }
  else if (a === 'kit') {
    var itk = item(c, s);
    var mk = modal('<h3>' + esc(itk.name) + '</h3><p>Cosa c\'è dentro: una cosa per riga, con la quantità.</p><textarea id="kt" rows="8" placeholder="10 penne&#10;2 forbici&#10;1 nastro biadesivo">' + esc(itk.kit || '') + '</textarea>' +
      '<div class="row2"><button class="btn-g" id="kc">Annulla</button><button class="btn-k" id="kk">Salva</button></div>');
    mk.querySelector('#kc').onclick = closeModal;
    mk.querySelector('#kk').onclick = function () { var t = mk.querySelector('#kt').value; closeModal(); save('setKit', pinOf(S.inv), c, s, t).then(function () { toast('Contenuto salvato'); }); };
  }
  else if (a === 'close') { confirmClose(p); }
  else if (a === 'invedit') {
    if (S.inv) { S.inv = null; render(); return; }
    askPin('').then(function (pin) { if (pin && isAdmin()) { S.inv = S.data.producers[0]; render(); } });
  }
  else if (a === 'tot' || a === 'totin') {

  else if (a === 'add') {

      '<input id="an" placeholder="Nome articolo" autocomplete="off"><input id="at" inputmode="numeric" placeholder="Quanti ce ne sono?">' +

      var nm = m3.querySelector('#an').value, tt = m3.querySelector('#at').value; closeModal();

function collabModal(p) {
  var cl = ((S.data.owners || {})[p] || {}).collab || [];
  var m = modal('<h3>Collaboratori · ' + esc(p) + '</h3><p>Vedono solo questa lista e possono modificarla come te. Entrano con Google o con il link via email.</p>' +
    (cl.length ? '<div class="plist" style="margin:0 0 12px">' + cl.map(function (em) { return '<div class="arow"><div class="info"><b style="font-size:15px">' + esc(em) + '</b></div><button class="mini n" data-x="' + esc(em) + '" style="color:#B3261E" aria-label="Togli">✕</button></div>'; }).join('') + '</div>' : '') +
    '<input id="cem" type="email" inputmode="email" autocomplete="off" placeholder="email del collaboratore">' +
    '<div class="row2"><button class="btn-g" id="cc">Chiudi</button><button class="btn-k" id="ck">Aggiungi</button></div>');
  m.querySelector('#cc').onclick = closeModal;
  m.querySelectorAll('[data-x]').forEach(function (b) { b.onclick = function () { closeModal(); save('setCollab', p, b.getAttribute('data-x'), false).then(function () { toast('Tolto'); collabModal(p); }); }; });
  m.querySelector('#ck').onclick = function () {
    var em = m.querySelector('#cem').value.trim(); if (!em) return;
    closeModal(); save('setCollab', p, em, true).then(function () {
      var url = S.data.appUrl + '?l=' + FBX.listId(p), txt = 'Ti ho aggiunto alla lista magazzino "' + p + '". Entra da qui con la tua email (' + em.toLowerCase() + '): ' + url;
      var m2 = modal('<h3>Aggiunto</h3><p>Mandagli il link: entra con <b>' + esc(em.toLowerCase()) + '</b> e vede solo questa lista.</p><div class="row2"><button class="btn-g" id="c2">Chiudi</button><a class="btn-k wa" target="_blank" href="https://wa.me/?text=' + encodeURIComponent(txt) + '">WhatsApp</a></div>');
      m2.querySelector('#c2').onclick = closeModal;
    });
  };
}
function shareList(p) {
  var url = S.data.appUrl + '?l=' + FBX.listId(p);
  var txt = 'Lista magazzino di ' + p + ': ' + url;
  var m = modal('<h3>Condividi la lista di ' + esc(p) + '</h3><p>Il PA vede solo questa lista: può spuntare Preso e Rientro e lasciare note.</p>' +
    '<input id="sl" readonly value="' + esc(url) + '">' +
    '<div class="row2"><button class="btn-g" id="sc">Copia link</button><a class="btn-k wa" target="_blank" href="https://wa.me/?text=' + encodeURIComponent(txt) + '">WhatsApp</a></div>');
  m.querySelector('#sc').onclick = function () {
    var i = m.querySelector('#sl'); i.select();
    var ok = function () { toast('Link copiato'); };
    try { navigator.clipboard.writeText(url).then(ok, function () { document.execCommand('copy'); ok(); }); } catch (e) { try { document.execCommand('copy'); ok(); } catch (e2) {} }
  };
}
function confirmClose(p) {
  var cons = [], open = [];
  S.data.sections.forEach(function (s) { s.items.forEach(function (it) {
    var e = it.lists[p]; if (!hasQty(e) || e.rientrato || typeof e.qty !== 'number') return;
    if (it.type !== 'cons') open.push(it.name + ' (' + e.qty + ')');
  }); });
  var h = '<h3>Chiudi produzione di ' + esc(p) + '</h3>';
  h += '<p>La lista va nello <b>Storico produzioni</b> (da lì scarichi il PDF quando vuoi) e sparisce dalle liste aperte.</p>';
  if (open.length) h += '<p><b>Attenzione:</b> questa attrezzatura non è segnata come rientrata (resta scritto nel PDF). Chiudendo torna disponibile; se è persa o rotta, abbassa il totale in Magazzino.</p><ul>' + open.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
  var m = modal(h + '<div class="row2"><button class="btn-g" id="cc">Annulla</button><button class="btn-d" id="ck">Chiudi e archivia</button></div>');
  m.querySelector('#cc').onclick = closeModal;
  m.querySelector('#ck').onclick = function () { closeModal(); save('chiudiProduzione', p, pinOf(p)).then(function (ok) { if (ok === false) return; S.edit = false; S.mq = ''; S.producer = null; go('home'); toast('Produzione chiusa · è nello storico'); }).catch(function () {}); };
}

load();
</script>
