# Pubblica l'app su https://courage-magazzino.web.app ogni volta che cambia.
name: Sito Magazzino
on:
  push:
    branches: [main]
    paths: ['index.html', '*.js', '*.png', 'manifest.webmanifest', 'firebase.json', '.github/workflows/sito.yml', '.github/scripts/*.mjs']
  workflow_dispatch:
jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepara il sito
        run: |
          mkdir -p public
          cp index.html api.js extra.js fb.js pdf.js *.png manifest.webmanifest public/
      - name: Chiave di servizio
        env:
          SA: ${{ secrets.FIREBASE_SA }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: Sito e accessi
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npm install --no-save google-auth-library@9 >/dev/null
          node .github/scripts/sito.mjs
          node .github/scripts/domini.mjs
      - name: Pubblica
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx -y firebase-tools@latest deploy --only hosting --project courage-magazzino --non-interactive
